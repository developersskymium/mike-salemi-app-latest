<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace — Mike Salemi App signature concept</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b0d10; color: #e9edf0; }
  header { padding: 40px 48px 8px; display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 40px; letter-spacing: -.02em; }
  p { margin: 8px 0 0; color: #9aa6b0; max-width: 70ch; line-height: 1.5; }
  .tg { display: inline-flex; border-radius: 99px; padding: 4px; background: #1b1f24; }
  .tg button { border: 0; background: none; color: #9aa6b0; font: inherit; padding: 8px 16px; border-radius: 99px; cursor: pointer; }
  .tg button.on { background: #5CC8F5; color: #04182a; font-weight: 600; }
  .row { display: flex; gap: 32px; padding: 32px 48px; align-items: flex-start; flex-wrap: wrap; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color: #9aa6b0; margin-top: 10px; }
  .phone { width: 390px; height: 844px; border-radius: 48px; overflow: hidden; box-shadow: 0 0 0 10px #1c2024, 0 0 0 11px #2c3238, 0 30px 80px -20px rgba(0,0,0,.8); }
  .desk { width: 1152px; height: 720px; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px #2c3238, 0 30px 80px -20px rgba(0,0,0,.8); }
  .desk iframe { width: 1440px; height: 900px; transform: scale(.8); transform-origin: 0 0; }
  iframe { border: 0; display: block; width: 100%; height: 100%; }
  a { color: #5CC8F5; }
</style></head><body>
<header><div><h1>Trace</h1><p>Every rep leaves a mark. Long-exposure light painting: training drawn as glacier light with a hot head and a fading tail. Night exposure with star trails over Mount Shasta in dark; glacier contour lines on snow in light.</p><p><a href="identity.html">Open the identity sheet</a> · <a href="today.html">Today</a> · <a href="program.html">Program</a> · <a href="day.html">Day view</a> · <a href="complete.html">Completion</a></p></div>
<div class="tg"><button data-t="light">Light</button><button data-t="dark" class="on">Dark</button></div></header>
<div class="row">
  <figure><div class="phone"><iframe data-src="today.html" title="Today"></iframe></div><figcaption>Today</figcaption></figure>
  <figure><div class="phone"><iframe data-src="complete.html" title="Completion"></iframe></div><figcaption>Day 25 complete (reload to replay)</figcaption></figure>
</div>
<div class="row">
  <figure><div class="desk"><iframe data-src="program.html" title="Program"></iframe></div><figcaption>Kettlebell Lifestyle program</figcaption></figure>
  <figure><div class="desk"><iframe data-src="day.html" title="Day view"></iframe></div><figcaption>Day 25 · Workout III (scroll for the workout table)</figcaption></figure>
</div>
<script>
  function set(t) { document.querySelectorAll("iframe").forEach(f => f.src = f.dataset.src + "?theme=" + t); document.querySelectorAll(".tg button").forEach(b => b.classList.toggle("on", b.dataset.t === t)); }
  document.querySelectorAll(".tg button").forEach(b => b.onclick = () => set(b.dataset.t)); set("dark");
</script></body></html>
